name: Auto Resolve and Merge PRs

on:
  schedule:
    - cron: "0 */4 * * *" # Run every 4 hours to autonomously resolve conflicts and squash-merge
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl git
          npm install -g @google/gemini-cli

      - name: Log environment setup
        run: |
          echo "Node.js version: $(node -v)"
          echo "npm version: $(npm -v)"
          echo "jq version: $(jq --version)"
          echo "gemini version: $(gemini --version)"
          echo "git version: $(git --version)"
          echo "python version: $(python3 --version)"

      - name: Run PR resolution script
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./auto_resolve_prs.sh

      - name: Run Autonomous Prompt Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 autonomous_agent.py

      - name: Commit and push prompt improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prompts.json evaluation_data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: autonomous prompt improvements and evaluation data update"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to prompts or evaluation data."
          fi
