name: Auto Resolve and Merge PRs

on:
  schedule:
    # Run every 4 hours to autonomously resolve conflicts and squash-merge.
    # This interval is a project requirement for autonomous PR resolution.
    - cron: "0 */4 * * *"
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl git gh sqlite3 python3-yaml
          npm install -g @google/gemini-cli

      - name: Log environment setup
        run: |
          echo "Node.js version: $(node -v)"
          echo "npm version: $(npm -v)"
          echo "jq version: $(jq --version)"
          echo "gemini version: $(gemini --version)"
          echo "git version: $(git --version)"
          echo "python version: $(python3 --version)"

      - name: Install Agent Skills
        run: |
          if [ -d "agent-skills" ]; then
            echo "Discovering and installing agent skills..."
            # Install each skill directory. The gemini skills install command
            # registers the skill for the current environment.
            find agent-skills -maxdepth 1 -mindepth 1 -type d -exec gemini skills install {} \;
          else
            echo "No agent-skills directory found. Skipping."
          fi

      - name: Gemini CLI Health Check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.0-flash
        run: |
          if ! gemini --version; then
            echo "Error: Gemini CLI is not operational."
            exit 1
          fi
          # Proactive connectivity check
          echo "Verifying Gemini API connectivity..."
          if ! timeout 30 gemini --prompt "ping" --model "$GEMINI_MODEL" --approval-mode yolo --skip-trust; then
            echo "Error: Gemini API health check failed."
            exit 1
          fi

      - name: Run PR resolution script
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./auto_resolve_prs.sh

      - name: Run Autonomous Prompt Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 autonomous_agent.py

      - name: Commit and push prompt improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prompts.json evaluation_data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: autonomous prompt improvements and evaluation data update"
            # Dynamically determine the default branch
            DEFAULT_BRANCH=$(git remote show origin | grep "HEAD branch" | cut -d' ' -f5)
            echo "Default branch is $DEFAULT_BRANCH"
            # Rebase against the base branch in case any PRs were merged in this run
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          else
            echo "No changes to prompts or evaluation data."
          fi
